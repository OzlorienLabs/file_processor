<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f2f2" />
    <link rel="icon" type="image/svg+xml" href="/marks/brand.svg" />
    <meta
      name="description"
      content="Private, client-first tools to merge, split, compress, convert, summarize, OCR, and transcribe your files."
    />
    <title>FileKit — useful file tools, without the upload anxiety</title>
    <script>
      // Suppress upstream browser/DevTools VM instrumentation bug (Chromium #543499029)
      // where Chrome's auto-injected soft navigation tracker crashes on undefined entry.startTime.
      window.addEventListener('error', function (event) {
        if (
          event.message &&
          event.message.includes("reading 'startTime'") &&
          (!event.filename || event.filename.includes('VM') || event.filename.includes('<anonymous>'))
        ) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

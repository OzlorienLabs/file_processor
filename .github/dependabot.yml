version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels: [dependencies]
    groups:
      # One PR per family keeps CI runs (and review load) low.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Held by `overrides` in package.json until upstream bumps its pins —
      # see the gotcha in CLAUDE.md before letting these float.
      - dependency-name: adm-zip
      - dependency-name: sharp

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    labels: [dependencies, ci]

name: Dependencies

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Monday 06:00 UTC — catches advisories published after a PR merged.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: deps-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Resolves against package-lock.json; no install needed.
      # `overrides` in package.json pin the patched adm-zip / sharp that
      # @huggingface/transformers' own range holds at vulnerable versions.
      - run: npm audit --audit-level=high

  outdated:
    name: Outdated report
    runs-on: ubuntu-latest
    # Informational only — never blocks a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: List outdated packages
        run: |
          {
            echo '## Outdated dependencies'
            echo
            echo '```'
            npm outdated || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      # dependency-review-action needs the repository's Dependency graph. When it is off
      # (Settings -> Advanced Security -> Dependency graph) the action fails with
      # "Dependency review is not supported on this repository", so probe the SBOM
      # endpoint first and skip with a notice instead of failing the check. The blocking
      # `npm audit` job above still gates vulnerabilities either way.
      - name: Check whether Dependency graph is enabled
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" --silent >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Dependency review skipped::Enable Dependency graph (Settings -> Advanced Security) to activate this check."
          fi
      # Flags newly introduced vulnerable or disallowed-license deps in the diff.
      - uses: actions/dependency-review-action@v5
        if: steps.graph.outputs.enabled == 'true'
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
